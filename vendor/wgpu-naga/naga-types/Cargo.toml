[package]
name = "naga-types"
version = "30.0.0"
edition = "2021"
description = "Common types for naga and wgpu"
homepage = "https://wgpu.rs/"
repository = "https://github.com/kvark/wgpu"
license = "MIT OR Apache-2.0"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]


[features]
serialize = ["dep:serde", "indexmap/serde"]
deserialize = ["dep:serde", "indexmap/serde"]
arbitrary = ["dep:arbitrary", "std", "indexmap/arbitrary"]
std = []

[dependencies]
arbitrary = { version = "1.4.2", features = ["derive"], optional = true }
hashbrown = { version = "0.17", default-features = false, features = ["default-hasher", "inline-more"] }
indexmap = { version = "2.11.4", default-features = false }
rustc-hash = { version = "1.1", default-features = false }
serde = { version = "1.0.225", default-features = false, features = ["alloc", "derive"], optional = true }
thiserror = { version = "2.0.12", default-features = false }
